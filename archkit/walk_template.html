<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>__TITLE__ - Walkthrough</title>
<style>
/* VOICE: quiet game HUD; IDEA: first-person walk of a validated model; PICTURE: the building full-bleed;
   COLOUR/TYPE: dark glass HUD, white type, one orange accent; system UI font; LAYOUT: canvas + corner HUD. */
:root{color-scheme:dark;--acc:#ff8a3d}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0b0e12;color:#f2f4f7;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.g{background:rgba(12,15,20,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:10px}
#hud{position:fixed;left:14px;top:14px;padding:10px 14px;max-width:calc(100vw - 230px)}#loc{font-weight:600;font-size:17px}#sub{font-size:12.5px;color:#b8c0cc}
#mapw{position:fixed;right:14px;top:14px;padding:6px}#map{display:block;width:190px;height:150px}
#prompt{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);padding:8px 14px;display:none;white-space:nowrap}#prompt b{color:var(--acc)}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.4);pointer-events:none}
#bar{position:fixed;left:14px;bottom:14px;padding:8px;display:flex;gap:6px;flex-wrap:wrap}
button{font:500 13px system-ui,sans-serif;color:#f2f4f7;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:7px;height:36px;padding:0 12px;cursor:pointer}
button[aria-pressed=true]{background:#f2f4f7;color:#111}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#elev{position:fixed;right:14px;bottom:14px;padding:10px;display:none;flex-direction:column;gap:6px}#elev button{width:56px;height:44px;font-size:16px}
#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,7,10,.86);z-index:9;padding:20px}
#start .card{max-width:520px;padding:24px 26px}#start h1{margin:0 0 6px;font-size:28px}#start p{color:#c3cad4;margin:0 0 14px}
#go{height:46px;padding:0 22px;background:var(--acc);color:#111;border:0;font-weight:600;font-size:16px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}
#stick,#use{display:none}
@media (pointer:coarse){#stick{display:block;position:fixed;left:24px;bottom:110px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}
 #knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.35)}
 #use{display:block;position:fixed;right:24px;bottom:120px;width:72px;height:72px;border-radius:50%;background:var(--acc);color:#111;border:0;font-weight:700}}
@media (max-width:640px){#map{width:130px;height:100px}#hud{max-width:calc(100vw - 170px)}}
</style>
</head>
<body>

<div id="prompt" class="g"></div>

<div id="elev" class="g"></div>
<div id="stick"><div id="knob"></div></div><button id="use">USE</button>
<div id="fade"></div>
<div id="start"><div class="card g"><h1>__TITLE__</h1><p>Generated from a validated building model. WASD / arrows to move, mouse to look (click to capture, Esc to release), Shift to run, E for doors, elevator buttons inside the car. Phones: left stick, drag to look, USE.</p><button id="go">Walk in</button></div></div>

m('white',{color:0xf5f5f2,roughness:.3});m('fabric',{color:0x4c5a6b,roughness:1});m('linen',{color:0xf4f3ef,roughness:1});m('steel',{color:0x8c939b,roughness:.4,metalness:.6});
m('dark',{color:0x15171a,roughness:.3});m('beige',{color:0xcfc6b5,roughness:.8});m('door',{color:0xece9e2,roughness:.5});m('extdoor',{color:0x2f5d62,roughness:.45});
const EM={light:new T.MeshStandardMaterial({color:0xfff6e6,emissive:0xffe2b8,emissiveIntensity:.6})};

// ---- merged static geometry ----
const B={};function push(k,g){(B[k]=B[k]||[]).push(g.index?g.toNonIndexed():g)}
function uvBox(g,w,h,d,t){const u=g.attributes.uv,D=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];for(let f=0;f<6;f++)for(let v=0;v<4;v++){const i=f*4+v;u.setXY(i,u.getX(i)*D[f][0]/t,u.getY(i)*D[f][1]/t)}}

for(const g of S.guards){const L=Math.hypot(g.b[0]-g.a[0],g.b[1]-g.a[1]);obox((g.a[0]+g.b[0])/2,(g.a[1]+g.b[1])/2,Math.atan2(g.b[1]-g.a[1],g.b[0]-g.a[0]),L,0.12,g.z0,g.z1,'paint')}
const STY={bed_king:'bed',bed_queen:'bed',bed_full:'bed',bed_twin:'bed',sofa:'fabric',armchair:'fabric',chair:'fabric',toilet:'white',toilet_ada:'white',lavatory:'white',lavatory_ada:'white',tub:'white',
 shower:'tile',shower_rollin:'tile',vanity:'beige',kitchen_counter:'beige',kitchen_sink:'beige',counter:'beige',reception_desk:'wood',washer:'white',dryer:'white',fridge:'steel',range:'steel',tv_wall:'dark',mirror:'steel',ptac:'beige',equipment:'steel',vending:'dark',planter:'conc'};

  if(k==='bed'){abox(o.x0,o.y0,o.x1,o.y1,o.z0,o.z0+1.1,'dark');abox(o.x0+.05,o.y0+.05,o.x1-.05,o.y1-.05,o.z0+1.1,o.z1,'linen');

const hemi=new T.HemisphereLight(0xdfeaf5,0x6b5f50,.75),amb=new T.AmbientLight(0xffffff,.25),sun=new T.DirectionalLight(0xfff1dc,2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const sz=Math.max(bx1-bx0,by1-by0)*0.8+40;Object.assign(sun.shadow.camera,{left:-sz,right:sz,top:sz,bottom:-sz,near:1,far:900});sun.shadow.bias=-.0006;sun.shadow.normalBias=.05;

const PL=[];for(let i=0;i<8;i++){const l=new T.PointLight(0xffe2b8,0,22,2);scene.add(l);PL.push(l)}
let night=false;function setT(n){night=n;scene.background.setHex(n?0x070a12:0xa9c7e6);scene.fog.color.setHex(n?0x070a12:0xa9c7e6);hemi.intensity=n?.08:.75;amb.intensity=n?.06:.25;sun.intensity=n?.1:2;EM.light.emissiveIntensity=n?2:.6;
  document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.t==='night')===n))}

// ---- walking ----
const Pp={x:S.spawn?S.spawn.x:bx0-10,y:S.spawn?S.spawn.y:(by0+by1)/2,z:0,yaw:S.spawn?S.spawn.yaw:0,pitch:0,vz:0};const RAD=0.8,EYE=5.4;
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))c=!c}return c}

  for(const g of S.guards){if(g.z1<=z0||g.z0>=z1)continue;const L=Math.hypot(g.b[0]-g.a[0],g.b[1]-g.a[1]);if(hitOBB(x,y,(g.a[0]+g.b[0])/2,(g.a[1]+g.b[1])/2,Math.atan2(g.b[1]-g.a[1],g.b[0]-g.a[0]),L,.12,RAD))return true}

  return false}
function step(dt,mx,my,fast){const sp=(fast?14:7)*dt,fx=-Math.sin(Pp.yaw),fy=-Math.cos(Pp.yaw),rx=Math.cos(Pp.yaw),ry=-Math.sin(Pp.yaw);const dx=(fx*my+rx*mx)*sp,dy=(fy*my+ry*mx)*sp;
  const ok=(nx,ny)=>{const f=floorAt(nx,ny,Pp.z);return !isNaN(f)&&f<=Pp.z+1.05&&!blocked(nx,ny,Math.max(Pp.z,f))};
  if(dx&&ok(Pp.x+dx,Pp.y))Pp.x+=dx;if(dy&&ok(Pp.x,Pp.y+dy))Pp.y+=dy;let f=floorAt(Pp.x,Pp.y,Pp.z);if(isNaN(f))f=Pp.z;
  if(Pp.z>f+.05){if(Pp.z-f<1.3&&Pp.vz===0)Pp.z=Math.max(f,Pp.z-dt*14);else{Pp.vz-=60*dt;Pp.z=Math.max(f,Pp.z+Pp.vz*dt);if(Pp.z===f)Pp.vz=0}}else{Pp.z+=(f-Pp.z)*Math.min(1,dt*18);Pp.vz=0}}
// ---- input ----
const keys={};let started=false,locked=false,drag=false,lx=0,ly=0,stickV={x:0,y:0},sid=null,lid=null;
addEventListener('keydown',e=>{keys[e.code]=true;if(started&&e.code==='KeyE')use()});addEventListener('keyup',e=>keys[e.code]=false);
const cv=$('#c');cv.addEventListener('mousedown',e=>{if(!started)return;drag=true;lx=e.clientX;ly=e.clientY;try{const r=cv.requestPointerLock&&cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(_){}});
addEventListener('mouseup',()=>drag=false);document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===cv);
addEventListener('mousemove',e=>{if(!started)return;if(locked)look(e.movementX,e.movementY);else if(drag){look((e.clientX-lx)*1.4,(e.clientY-ly)*1.4);lx=e.clientX;ly=e.clientY}});
function look(dx,dy){Pp.yaw-=dx*.0022;Pp.pitch=Math.max(-1.45,Math.min(1.45,Pp.pitch-dy*.0022))}
const st=$('#stick'),kn=$('#knob');
addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.target.closest&&t.target.closest('button'))continue;if(sid===null&&t.clientX<innerWidth*.45&&t.clientY>innerHeight*.35){sid=t.identifier;mv(t)}else if(lid===null){lid=t.identifier;lx=t.clientX;ly=t.clientY}}},{passive:true});
addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===sid)mv(t);if(t.identifier===lid){look((t.clientX-lx)*2.2,(t.clientY-ly)*2.2);lx=t.clientX;ly=t.clientY}}},{passive:true});
addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===sid){sid=null;stickV={x:0,y:0};kn.style.transform=''}if(t.identifier===lid)lid=null}});
function mv(t){const r=st.getBoundingClientRect();let dx=t.clientX-r.left-r.width/2,dy=t.clientY-r.top-r.height/2;const m=Math.hypot(dx,dy);if(m>50){dx*=50/m;dy*=50/m}stickV={x:dx/50,y:dy/50};kn.style.transform=`translate(${dx}px,${dy}px)`}
$('#use').addEventListener('click',()=>use());
// ---- interaction ----
function target(){const fx=-Math.sin(Pp.yaw),fy=-Math.cos(Pp.yaw);let best=null,bd=6;
  for(const d of DOORS){if(Math.abs(d.z-Pp.z)>3)continue;const a=d.closed*Math.PI/180;const cx=d.hinge[0]+Math.cos(a)*d.w/2,cy=d.hinge[1]+Math.sin(a)*d.w/2;const dx=cx-Pp.x,dy=cy-Pp.y,dist=Math.hypot(dx,dy);if(dist<bd&&(dx*fx+dy*fy)/Math.max(dist,.01)>.3){bd=dist;best=d}}return best}
function use(){const d=target();if(!d)return;const open=d.kind==='swing'?Math.abs(d.target-d.closed)<1:d.slideT===0;for(const e of DOORS){if(e.id!==d.id)continue;if(e.kind==='swing')e.target=open?e.open:e.closed;else e.slideT=open?e.w-.2:0}}
function inElev(){for(const f of S.floors)if(f.type==='elevator'&&Math.abs(f.z-Pp.z)<1&&inRec(Pp.x,Pp.y,f))return f;return null}
const levels=S.levels;$('#elev').innerHTML=levels.slice().reverse().map(L=>`<button data-l="${L.elev}">${L.id}</button>`).join('');
$('#elev').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;const z=+b.dataset.l;$('#fade').style.opacity=1;setTimeout(()=>{Pp.z=z;Pp.vz=0;$('#fade').style.opacity=0},450)});
function where(){if(Pp.z>S.roof.z-1)return['Roof',''];let best=null;for(const f of S.floors)if(Math.abs(f.z-Pp.z)<5.5&&inRec(Pp.x,Pp.y,f)){best=f;break}
  if(best)return[best.name,best.level];for(const r of S.ramps){const L=Math.hypot(r.end[0]-r.start[0],r.end[1]-r.start[1]);const t=((Pp.x-r.start[0])*(r.end[0]-r.start[0])+(Pp.y-r.start[1])*(r.end[1]-r.start[1]))/(L*L);if(t>-0.1&&t<1.1)return['Stair','between levels']}return['Outside','']}
// ---- minimap ----
const mc=$('#map'),mg=mc.getContext('2d');
function drawMap(){mg.fillStyle='#0e1218';mg.fillRect(0,0,mc.width,mc.height);const s=Math.min(mc.width/(bx1-bx0+20),mc.height/(by1-by0+20));mg.save();mg.translate(mc.width/2,mc.height/2);mg.scale(s,s);mg.translate(-(bx0+bx1)/2,-(by0+by1)/2);
  let lev=levels[0];for(const L of levels)if(Pp.z>=L.elev-1)lev=L;mg.fillStyle='#1f2731';for(const f of S.floors)if(f.z===lev.elev){mg.beginPath();f.poly.forEach((p,i)=>i?mg.lineTo(p[0],p[1]):mg.moveTo(p[0],p[1]));mg.fill()}
  mg.fillStyle='#d6dce4';for(const w of S.walls){if(w.z0!==lev.elev&&!(w.z0>=lev.elev&&w.z0<lev.elev+lev.height))continue;if(w.z0>lev.elev+0.01)continue;mg.save();mg.translate(w.c[0],w.c[1]);mg.rotate(w.ang*Math.PI/180);mg.fillRect(-w.len/2,-w.t/2,w.len,w.t);mg.restore()}
  mg.translate(Pp.x,Pp.y);mg.rotate(-Pp.yaw);mg.fillStyle='#ff8a3d';mg.beginPath();mg.moveTo(0,-3);mg.lineTo(2.2,2.4);mg.lineTo(-2.2,2.4);mg.closePath();mg.fill();mg.restore();
  mg.fillStyle='#e6e9ee';mg.font='600 20px system-ui';mg.fillText(lev.id,10,26)}
// ---- loop ----
const clock=new T.Clock();let tMap=0,tL=0;
function lightsUpdate(){const near=LIGHTS.filter(l=>Math.abs(l.z-(Pp.z+8))<5).map(l=>[Math.hypot(l.x-Pp.x,l.y-Pp.y),l]).sort((a,b)=>a[0]-b[0]);PL.forEach((p,i)=>{const n=near[i];if(n){p.position.set(n[1].x,n[1].z-.5,n[1].y);p.intensity=night?1.2:.6}else p.intensity=0})}
function tick(){const dt=Math.min(.05,clock.getDelta());
  if(started){let mx=0,my=0;if(keys.KeyW||keys.ArrowUp)my++;if(keys.KeyS||keys.ArrowDown)my--;if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;mx+=stickV.x;my-=stickV.y;const q=Math.hypot(mx,my);if(q>1){mx/=q;my/=q}step(dt,mx,my,keys.ShiftLeft||keys.ShiftRight)}
  for(const d of DOORS){if(d.kind==='swing'&&d.ang!==d.target){d.ang+=Math.sign(d.target-d.ang)*Math.min(Math.abs(d.target-d.ang),240*dt);d.pivot.rotation.y=-d.ang*Math.PI/180}
    if(d.kind!=='swing'&&d.slide!==d.slideT){d.slide+=Math.sign(d.slideT-d.slide)*Math.min(Math.abs(d.slideT-d.slide),6*dt);d.leaf.position.x=d.w/2-d.slide}}
  cam.position.set(Pp.x,Pp.z+EYE,Pp.y);cam.rotation.set(Pp.pitch,Pp.yaw,0);
  if((tL-=dt)<0){tL=.25;lightsUpdate()}
  if((tMap-=dt)<0){tMap=.1;drawMap();const [a,b]=where();$('#loc').textContent=a;$('#sub').textContent=b;const d=started&&target();const pr=$('#prompt');
    if(d){pr.innerHTML='<b>E</b> '+((d.kind==='swing'?Math.abs(d.target-d.closed)<1:d.slideT===0)?'open':'close')+' door';pr.style.display='block'}else pr.style.display='none';$('#elev').style.display=started&&inElev()?'flex':'none'}
  R.render(scene,cam);requestAnimationFrame(tick)}
$('#go').addEventListener('click',()=>{started=true;$('#start').style.display='none';try{const r=cv.requestPointerLock&&cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(_){}});
setT(false);requestAnimationFrame(tick);
window.__walk={P:Pp,step,use,setT,DOORS};
}
</script>
